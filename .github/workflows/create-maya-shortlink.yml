name: Create Maya short link

on:
  push:
    branches:
      - maya-links
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - name: Create is.gd short link
        shell: bash
        run: |
          set -euo pipefail
          TARGET='https://raw.githack.com/eastcoast22ec-pixel/Gallery/maya-links/maya/index.html'
          RESULT="$(curl -fsS -G 'https://is.gd/create.php' \
            --data-urlencode 'format=simple' \
            --data-urlencode "url=$TARGET" \
            --data-urlencode 'shorturl=mayaLDM')"
          echo "SHORT_URL=$RESULT"
