name: Create Maya short link

on:
  push:
    branches:
      - maya-links
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - name: Create TinyURL
        shell: bash
        run: |
          set -euo pipefail
          TARGET='https://raw.githack.com/eastcoast22ec-pixel/Gallery/maya-links/maya/index.html'
          RESULT="$(curl -fsS -G 'https://tinyurl.com/api-create.php' --data-urlencode "url=$TARGET")"
          if [[ ! "$RESULT" =~ ^https://tinyurl\.com/ ]]; then
            echo "Invalid short URL response: $RESULT" >&2
            exit 1
          fi
          echo "SHORT_URL=$RESULT"
