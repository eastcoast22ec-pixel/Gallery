name: Create Maya short link

on:
  push:
    branches:
      - maya-links
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - name: Create v.gd short link
        shell: bash
        run: |
          set -euo pipefail
          TARGET='https://raw.githack.com/eastcoast22ec-pixel/Gallery/maya-links/maya/index.html'
          RESULT="$(curl -fsS -G 'https://v.gd/create.php' \
            --data-urlencode 'format=simple' \
            --data-urlencode "url=$TARGET")"
          if [[ "$RESULT" == Error:* ]]; then
            echo "$RESULT" >&2
            exit 1
          fi
          echo "SHORT_URL=$RESULT"
