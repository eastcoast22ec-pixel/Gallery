name: Verify Maya short link

on:
  push:
    branches:
      - maya-links
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify short URL end to end
        shell: bash
        run: |
          set -euo pipefail
          SHORT='https://tinyurl.com/2coq98uu'
          FINAL="$(curl -L -fsS -o /tmp/maya.html -w '%{url_effective}' "$SHORT")"
          CODE="$(curl -L -sS -o /dev/null -w '%{http_code}' "$SHORT")"
          grep -q 'Maya Linge de Maison' /tmp/maya.html
          echo "FINAL_URL=$FINAL"
          echo "HTTP_CODE=$CODE"
          if [[ "$CODE" != "200" ]]; then
            exit 1
          fi
