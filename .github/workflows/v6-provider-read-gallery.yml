name: V6 public control route probe

on:
  push:
    branches:
      - diagnostic/v6-provider-read-gallery-20260829
    paths:
      - .github/workflows/v6-provider-read-gallery.yml

permissions:
  contents: read

jobs:
  route-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public control route metadata
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://mp-zr-express-pwa.eastcoast22-ec.workers.dev/__control/public-result/circleci-public-v4-20260829-v6job1614'
          curl --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 1 --retry-delay 1 \
            -o /tmp/body.bin \
            -w 'http=%{http_code}\neffective_url=%{url_effective}\ncontent_type=%{content_type}\nredirects=%{num_redirects}\nbytes=%{size_download}\n' \
            "$endpoint"
          rm -f /tmp/body.bin
