name: MP Courier Locator

on:
  push:
    branches:
      - mp-artifact-courier-v5
    paths:
      - delivery/locator-request.json

permissions:
  actions: read
  contents: write

concurrency:
  group: mp-courier-locator
  cancel-in-progress: false

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Locate courier run and publish sanitized result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REQUEST_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          curl --fail --silent --show-error "${headers[@]}" \
            "${api}/contents/delivery/locator-request.json?ref=${REQUEST_SHA}" > /tmp/request-outer.json
          python3 - <<'PY'
          import base64,json,re
          outer=json.load(open('/tmp/request-outer.json'))
          req=json.loads(base64.b64decode(outer['content']).decode())
          if set(req) != {'schema_version','target_sha'} or req.get('schema_version') != 1:
              raise SystemExit('invalid locator request')
          sha=str(req['target_sha']).lower()
          if not re.fullmatch(r'[0-9a-f]{40}',sha): raise SystemExit('invalid target sha')
          open('/tmp/target_sha','w').write(sha)
          PY

          found=0
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error "${headers[@]}" \
              "${api}/actions/workflows/mp-artifact-courier-v5.yml/runs?branch=mp-artifact-courier-v5&event=push&per_page=50" > /tmp/runs.json
            python3 - <<'PY'
          import json
          target=open('/tmp/target_sha').read().strip()
          runs=json.load(open('/tmp/runs.json')).get('workflow_runs',[])
          match=next((r for r in runs if str(r.get('head_sha','')).lower()==target),None)
          json.dump({
            'run_id': match.get('id') if match else None,
            'status': match.get('status') if match else None,
            'conclusion': match.get('conclusion') if match else None,
          },open('/tmp/run.json','w'),separators=(',',':'))
          PY
            run_id="$(python3 -c 'import json; print(json.load(open("/tmp/run.json")).get("run_id") or "")')"
            status="$(python3 -c 'import json; print(json.load(open("/tmp/run.json")).get("status") or "")')"
            if [ -n "$run_id" ] && [ "$status" = completed ]; then found=1; break; fi
            sleep 2
          done

          artifact_id=""
          artifact_name=""
          artifact_size=""
          if [ "$found" -eq 1 ]; then
            curl --fail --silent --show-error "${headers[@]}" \
              "${api}/actions/runs/${run_id}/artifacts?per_page=20" > /tmp/artifacts.json
            python3 - <<'PY'
          import json
          arts=json.load(open('/tmp/artifacts.json')).get('artifacts',[])
          matches=[a for a in arts if str(a.get('name','')).startswith('mp-artifact-courier-') and not a.get('expired')]
          a=matches[0] if len(matches)==1 else {}
          json.dump({'id':a.get('id'),'name':a.get('name'),'size':a.get('size_in_bytes')},open('/tmp/artifact.json','w'),separators=(',',':'))
          PY
            artifact_id="$(python3 -c 'import json; print(json.load(open("/tmp/artifact.json")).get("id") or "")')"
            artifact_name="$(python3 -c 'import json; print(json.load(open("/tmp/artifact.json")).get("name") or "")')"
            artifact_size="$(python3 -c 'import json; print(json.load(open("/tmp/artifact.json")).get("size") or "")')"
          fi

          TARGET_SHA="$(cat /tmp/target_sha)" RUN_ID="${run_id:-}" ARTIFACT_ID="$artifact_id" ARTIFACT_NAME="$artifact_name" ARTIFACT_SIZE="$artifact_size" python3 - <<'PY'
          import json,os
          run=json.load(open('/tmp/run.json')) if os.path.exists('/tmp/run.json') else {}
          result={
            'schema_version':1,
            'target_sha':os.environ['TARGET_SHA'],
            'courier_run_id':int(os.environ['RUN_ID']) if os.environ['RUN_ID'] else None,
            'courier_status':run.get('status'),
            'courier_conclusion':run.get('conclusion'),
            'artifact_id':int(os.environ['ARTIFACT_ID']) if os.environ['ARTIFACT_ID'] else None,
            'artifact_name':os.environ['ARTIFACT_NAME'] or None,
            'artifact_size_bytes':int(os.environ['ARTIFACT_SIZE']) if os.environ['ARTIFACT_SIZE'] else None,
            'locator_run_id':int(os.environ['GITHUB_RUN_ID']),
          }
          json.dump(result,open('/tmp/result.json','w'),separators=(',',':'))
          PY

          encoded="$(base64 -w0 /tmp/result.json)"
          existing_sha="$(curl --silent --show-error "${headers[@]}" "${api}/contents/delivery/courier-locator.json?ref=${REF_NAME}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))' 2>/dev/null || true)"
          ENCODED="$encoded" EXISTING_SHA="$existing_sha" python3 - <<'PY'
          import json,os
          p={'message':'delivery: publish courier locator','content':os.environ['ENCODED'],'branch':os.environ['REF_NAME']}
          if os.environ.get('EXISTING_SHA','').strip(): p['sha']=os.environ['EXISTING_SHA'].strip()
          json.dump(p,open('/tmp/put.json','w'),separators=(',',':'))
          PY
          curl --fail --silent --show-error -X PUT "${headers[@]}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/put.json "${api}/contents/delivery/courier-locator.json" >/dev/null
