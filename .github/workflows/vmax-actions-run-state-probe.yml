name: VMAX Actions Run State Probe

on:
  push:
    branches:
      - mp-artifact-courier-v5
    paths:
      - .github/workflows/vmax-actions-run-state-probe.yml

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read exact fresh courier run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          START_SHA: ${{ github.sha }}
          COURIER_SHA: d655d7797e1dbed6d2ee714ca510140ec7721782
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          api="https://api.github.com/repos/${REPO}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          matched='{}'
          for _ in $(seq 1 18); do
            curl --fail --silent --show-error "${headers[@]}" \
              "${api}/actions/workflows/mp-artifact-courier-v5.yml/runs?branch=mp-artifact-courier-v5&event=push&per_page=50" \
              -o /tmp/courier-runs.json
            matched="$(COURIER_SHA="$COURIER_SHA" python3 - <<'PY'
          import json,os
          wanted=os.environ['COURIER_SHA'].lower()
          runs=json.load(open('/tmp/courier-runs.json',encoding='utf-8')).get('workflow_runs',[])
          r=next((x for x in runs if str(x.get('head_sha','')).lower()==wanted),None)
          if not r:
              print('{}')
          else:
              print(json.dumps({'run_id':r.get('id'),'status':r.get('status'),'conclusion':r.get('conclusion'),'run_attempt':r.get('run_attempt'),'created_at':r.get('created_at'),'updated_at':r.get('updated_at'),'head_sha':r.get('head_sha')},separators=(',',':')))
          PY
          )"
            status="$(MATCHED="$matched" python3 -c 'import json,os; print((json.loads(os.environ["MATCHED"]) or {}).get("status", ""))')"
            [ "$status" = completed ] && break
            sleep 5
          done

          run_id="$(MATCHED="$matched" python3 -c 'import json,os; x=json.loads(os.environ["MATCHED"]) or {}; print(x.get("run_id") or "")')"
          artifacts='[]'
          if [[ "$run_id" =~ ^[0-9]+$ ]]; then
            curl --fail --silent --show-error "${headers[@]}" "${api}/actions/runs/${run_id}/artifacts?per_page=100" -o /tmp/artifacts.json
            artifacts="$(python3 - <<'PY'
          import json
          a=json.load(open('/tmp/artifacts.json',encoding='utf-8')).get('artifacts',[])
          clean=[{'id':x.get('id'),'name':x.get('name'),'size_in_bytes':x.get('size_in_bytes'),'expired':x.get('expired')} for x in a]
          print(json.dumps(clean,separators=(',',':')))
          PY
          )"
          fi

          MATCHED="$matched" ARTIFACTS="$artifacts" START_SHA="$START_SHA" COURIER_SHA="$COURIER_SHA" python3 - <<'PY'
          import json,os
          result={
              'schema_version':1,
              'probe_source_sha':os.environ['START_SHA'].lower(),
              'courier_target_sha':os.environ['COURIER_SHA'].lower(),
              'courier_run':json.loads(os.environ['MATCHED']),
              'artifacts':json.loads(os.environ['ARTIFACTS']),
          }
          json.dump(result,open('/tmp/result.json','w',encoding='utf-8'),separators=(',',':'))
          PY

          current_sha="$(curl --fail --silent --show-error "${headers[@]}" "${api}/branches/${REF_NAME}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          [ "$current_sha" = "$START_SHA" ] || { echo "::error::Branch moved during probe; fail closed"; exit 40; }

          encoded="$(base64 -w0 /tmp/result.json)"
          result_api="${api}/contents/actions-run-probe/result.json"
          existing_sha="$(curl --silent --show-error "${headers[@]}" "${result_api}?ref=${REF_NAME}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha", ""))' 2>/dev/null || true)"
          ENCODED="$encoded" EXISTING_SHA="$existing_sha" REF_NAME="$REF_NAME" python3 - <<'PY'
          import json,os
          payload={'message':'probe(vmax): publish fresh LKG courier run state','content':os.environ['ENCODED'],'branch':os.environ['REF_NAME']}
          if os.environ.get('EXISTING_SHA','').strip(): payload['sha']=os.environ['EXISTING_SHA'].strip()
          json.dump(payload,open('/tmp/put.json','w'),separators=(',',':'))
          PY
          curl --fail --silent --show-error -X PUT "${headers[@]}" -H 'Content-Type: application/json' --data-binary @/tmp/put.json "$result_api" >/dev/null
