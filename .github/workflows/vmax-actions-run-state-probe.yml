name: VMAX Actions Run State Probe

on:
  push:
    branches:
      - mp-artifact-courier-v5
    paths:
      - .github/workflows/vmax-actions-run-state-probe.yml

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read exact courier and delivery run state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          START_SHA: ${{ github.sha }}
          COURIER_SHA: c7da02eda7cb04acb43559209cb524ea672dc348
          DELIVERY_SHA: cdb6dabb9e7786ae74d1ed7dfcdd43cc2dd14bdb
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          api="https://api.github.com/repos/${REPO}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          curl --fail --silent --show-error "${headers[@]}" \
            "${api}/actions/workflows/mp-artifact-courier-v5.yml/runs?branch=mp-artifact-courier-v5&event=push&per_page=50" \
            -o /tmp/courier-runs.json
          curl --fail --silent --show-error "${headers[@]}" \
            "${api}/actions/workflows/mp-chatgpt-artifact-delivery.yml/runs?branch=mp-artifact-courier-v5&event=push&per_page=50" \
            -o /tmp/delivery-runs.json

          COURIER_SHA="$COURIER_SHA" DELIVERY_SHA="$DELIVERY_SHA" START_SHA="$START_SHA" python3 - <<'PY'
          import json, os

          def exact(path, wanted):
              runs=json.load(open(path, encoding='utf-8')).get('workflow_runs', [])
              matches=[]
              for r in runs:
                  if str(r.get('head_sha','')).lower() != wanted.lower():
                      continue
                  matches.append({
                      'run_id': r.get('id'),
                      'status': r.get('status'),
                      'conclusion': r.get('conclusion'),
                      'run_attempt': r.get('run_attempt'),
                      'created_at': r.get('created_at'),
                      'updated_at': r.get('updated_at'),
                      'event': r.get('event'),
                      'head_sha': r.get('head_sha'),
                  })
              return matches

          result={
              'schema_version': 1,
              'probe_source_sha': os.environ['START_SHA'].lower(),
              'courier_target_sha': os.environ['COURIER_SHA'].lower(),
              'courier_runs': exact('/tmp/courier-runs.json', os.environ['COURIER_SHA']),
              'delivery_target_sha': os.environ['DELIVERY_SHA'].lower(),
              'delivery_runs': exact('/tmp/delivery-runs.json', os.environ['DELIVERY_SHA']),
          }
          json.dump(result, open('/tmp/result.json','w',encoding='utf-8'), separators=(',',':'))
          PY

          current_sha="$(curl --fail --silent --show-error "${headers[@]}" \
            "${api}/branches/${REF_NAME}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          [ "$current_sha" = "$START_SHA" ] || { echo "::error::Branch moved during probe; fail closed"; exit 40; }

          encoded="$(base64 -w0 /tmp/result.json)"
          result_api="${api}/contents/actions-run-probe/result.json"
          existing_sha="$(curl --silent --show-error "${headers[@]}" "${result_api}?ref=${REF_NAME}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha", ""))' 2>/dev/null || true)"
          ENCODED="$encoded" EXISTING_SHA="$existing_sha" REF_NAME="$REF_NAME" python3 - <<'PY'
          import json, os
          payload={
              'message':'probe(vmax): publish exact artifact workflow run state',
              'content':os.environ['ENCODED'],
              'branch':os.environ['REF_NAME'],
          }
          if os.environ.get('EXISTING_SHA','').strip(): payload['sha']=os.environ['EXISTING_SHA'].strip()
          json.dump(payload,open('/tmp/put.json','w'),separators=(',',':'))
          PY
          curl --fail --silent --show-error -X PUT "${headers[@]}" \
            -H 'Content-Type: application/json' --data-binary @/tmp/put.json "$result_api" >/dev/null
