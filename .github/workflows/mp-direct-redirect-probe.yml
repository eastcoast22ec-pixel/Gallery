name: MP Direct Redirect Probe

on:
  push:
    branches:
      - mp-artifact-courier-v5
    paths:
      - .github/workflows/mp-direct-redirect-probe.yml
      - probe/request.json

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe ingress direct endpoint without credentials
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ENDPOINT: https://mp-zr-webhook-ingress.eastcoast22-ec.workers.dev/__control/artifact-direct-ticket
        shell: bash
        run: |
          set -euo pipefail
          headers=/tmp/headers.txt
          body=/tmp/body.txt
          code="$(curl --silent --show-error --request POST --max-redirs 0 --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$ENDPOINT" || true)"
          CODE="$code" python3 - <<'PY'
          import json, os, urllib.parse
          lines=open('/tmp/headers.txt',encoding='utf-8',errors='replace').read().splitlines()
          loc=''
          for line in lines:
              if line.lower().startswith('location:'):
                  loc=line.split(':',1)[1].strip(); break
          host=path=None
          if loc:
              u=urllib.parse.urlsplit(loc)
              host=u.hostname
              path=u.path
          result={
            'schema_version':1,
            'http_status':int(os.environ['CODE']) if os.environ.get('CODE','').isdigit() else None,
            'location_host':host,
            'location_path':path,
            'location_present':bool(loc)
          }
          json.dump(result,open('/tmp/result.json','w'),separators=(',',':'))
          PY
          encoded="$(base64 -w0 /tmp/result.json)"
          api="https://api.github.com/repos/${REPO}/contents/probe/result.json"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          existing_sha="$(curl --silent --show-error "${headers[@]}" "${api}?ref=${REF_NAME}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha",""))' 2>/dev/null || true)"
          ENCODED="$encoded" EXISTING_SHA="$existing_sha" REF_NAME="$REF_NAME" python3 - <<'PY'
          import json,os
          p={'message':'probe: publish sanitized ingress direct status','content':os.environ['ENCODED'],'branch':os.environ['REF_NAME']}
          if os.environ.get('EXISTING_SHA'): p['sha']=os.environ['EXISTING_SHA']
          json.dump(p,open('/tmp/put.json','w'),separators=(',',':'))
          PY
          curl --fail --silent --show-error -X PUT "${headers[@]}" -H 'Content-Type: application/json' --data-binary @/tmp/put.json "$api" >/dev/null
