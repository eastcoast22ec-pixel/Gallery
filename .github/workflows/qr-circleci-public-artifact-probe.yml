name: QR Render Runtime Read

on:
  push:
    branches:
      - mp-artifact-courier-v5
    paths:
      - .github/workflows/qr-circleci-public-artifact-probe.yml

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read sanitized Render health
        shell: bash
        run: |
          set -euo pipefail
          URL='https://mp-export-zr-connector.onrender.com/health'
          code="$(curl --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 90 -o /tmp/health.json -w '%{http_code}' "$URL")"
          HEALTH_HTTP="$code" python3 - <<'PY'
          import json, os, re
          try:
              data=json.load(open('/tmp/health.json',encoding='utf-8'))
          except Exception:
              data={}
          safe=re.compile(r'^[A-Za-z0-9._:-]{1,120}$')
          def val(key):
              v=str(data.get(key,''))
              return v if safe.fullmatch(v) else 'missing'
          print('render_health_http='+os.environ['HEALTH_HTTP'])
          print('render_status='+val('status'))
          print('render_version='+val('version'))
          print('render_git_commit='+val('git_commit'))
          if os.environ['HEALTH_HTTP'] != '200' or val('status') != 'ok':
              raise SystemExit('render_health_failed')
          PY
