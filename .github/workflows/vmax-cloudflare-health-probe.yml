name: VMAX Cloudflare PWA Health Probe

on:
  push:
    branches:
      - mp-artifact-courier-v5
    paths:
      - .github/workflows/vmax-cloudflare-health-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Cloudflare PWA health
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          HEALTH_URL: https://mp-zr-express-pwa.eastcoast22-ec.workers.dev/healthz
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --max-time 45 -o /tmp/health.json -w '%{http_code}' "$HEALTH_URL" || true)"
          HTTP_CODE="$code" python3 - <<'PY'
          import json, os, re
          result={'schema_version':1,'http_status':int(os.environ['HTTP_CODE']) if os.environ.get('HTTP_CODE','').isdigit() else None,'status':None,'component':None,'control_revision':None}
          try:
              data=json.load(open('/tmp/health.json',encoding='utf-8'))
              for key in ('status','component','control_revision'):
                  value=str(data.get(key) or '')
                  if re.fullmatch(r'[A-Za-z0-9_.:+-]{1,120}', value): result[key]=value
          except Exception:
              pass
          if result['http_status'] != 200: raise SystemExit(f"health HTTP {result['http_status']}")
          if result['status'] != 'ok': raise SystemExit('health status is not ok')
          if result['component'] != 'mp-zr-cloudflare': raise SystemExit('unexpected health component')
          if result['control_revision'] != 'vmax-zero-copy-v1-3b18d57': raise SystemExit('live control revision mismatch')
          json.dump(result,open('/tmp/result.json','w'),separators=(',',':'))
          PY
          encoded="$(base64 -w0 /tmp/result.json)"
          api="https://api.github.com/repos/${REPO}/contents/cloudflare-probe/result.json"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          existing_sha="$(curl --silent --show-error "${headers[@]}" "${api}?ref=${REF_NAME}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha",""))' 2>/dev/null || true)"
          ENCODED="$encoded" EXISTING_SHA="$existing_sha" REF_NAME="$REF_NAME" python3 - <<'PY'
          import json,os
          payload={'message':'probe: publish sanitized Cloudflare PWA health','content':os.environ['ENCODED'],'branch':os.environ['REF_NAME']}
          if os.environ.get('EXISTING_SHA'): payload['sha']=os.environ['EXISTING_SHA']
          json.dump(payload,open('/tmp/put.json','w'),separators=(',',':'))
          PY
          curl --fail --silent --show-error -X PUT "${headers[@]}" -H 'Content-Type: application/json' --data-binary @/tmp/put.json "$api" >/dev/null
