name: MP Artifact Courier V5

on:
  push:
    branches:
      - mp-artifact-courier-v5
    paths:
      - courier/request.json

permissions:
  contents: read
  id-token: write

jobs:
  courier:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Validate request and bind OIDC audience
        env:
          REQUEST_API: https://api.github.com/repos/eastcoast22ec-pixel/Gallery/contents/courier/request.json?ref=${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --retry 2 --retry-delay 1 --retry-all-errors \
            -H 'Accept: application/vnd.github.raw+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$REQUEST_API" -o /tmp/request-source.json
          GITHUB_SHA_VALUE="$GITHUB_SHA" python3 - <<'PY'
          import hashlib, json, os, re
          src=json.load(open('/tmp/request-source.json', encoding='utf-8'))
          required={'schema_version','session_id','request_nonce','recipient_public_key_b64','source_sha','job_number','artifact_path','expected_size'}
          if set(src)!=required or src.get('schema_version')!=1: raise SystemExit('invalid request schema')
          if not re.fullmatch(r'[0-9a-f]{40}', str(src.get('source_sha','')).lower()): raise SystemExit('invalid source sha')
          binding=dict(src)
          binding['courier_sha']=os.environ['GITHUB_SHA_VALUE'].lower()
          canonical=json.dumps(binding,sort_keys=True,separators=(',',':'))
          audience='mp-artifact-courier:v1:'+hashlib.sha256(canonical.encode()).hexdigest()
          open('/tmp/binding.json','w',encoding='utf-8').write(canonical)
          open('/tmp/audience.txt','w',encoding='utf-8').write(audience)
          PY

      - name: Exchange GitHub OIDC for zero-copy handoff or relay grant
        env:
          DIRECT_ENDPOINT: https://mp-zr-webhook-ingress.eastcoast22-ec.workers.dev/__control/artifact-direct-ticket
        run: |
          set -euo pipefail
          umask 077
          audience="$(cat /tmp/audience.txt)"
          encoded_audience="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$audience")"
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" -o /tmp/oidc.json
          OIDC_TOKEN="$(python3 -c 'import json; print(json.load(open("/tmp/oidc.json"))["value"])')"
          http_code="$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/binding.json \
            -o /tmp/direct-response.json \
            -w '%{http_code}' \
            "$DIRECT_ENDPOINT")"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            DIRECT_HTTP="$http_code" python3 - <<'PY'
          import json, os, re
          try: code=str(json.load(open('/tmp/direct-response.json')).get('error','unknown'))
          except Exception: code='invalid_json'
          if not re.fullmatch(r'[A-Za-z0-9_.:-]{1,120}',code): code='redacted'
          print(f"direct_grant_failed http={os.environ['DIRECT_HTTP']} error={code}")
          PY
            exit 22
          fi
          python3 - <<'PY'
          import json,re
          data=json.load(open('/tmp/direct-response.json',encoding='utf-8'))
          if data.get('schema_version') != 1: raise SystemExit('invalid direct response schema')
          handoff=data.get('signed_handoff') or {}
          handoff_path=str(handoff.get('handoff_path','')).strip()
          handoff_name=str(handoff.get('filename','')).strip()
          handoff_sha=str(handoff.get('sha256','')).strip().lower()
          if handoff_path:
              if not re.fullmatch(r'/__control/artifact-handoff/[0-9a-f]{64}',handoff_path): raise SystemExit('invalid handoff path')
              if not re.fullmatch(r'[A-Za-z0-9._-]{1,180}',handoff_name): raise SystemExit('invalid handoff filename')
              if not re.fullmatch(r'[0-9a-f]{64}',handoff_sha): raise SystemExit('invalid handoff sha256')
              json.dump({
                  'schema_version':1,
                  'mode':'zero-copy',
                  'handoff_path':handoff_path,
                  'filename':handoff_name,
                  'sha256':handoff_sha,
                  'job_number':handoff.get('job_number'),
                  'artifact_path':handoff.get('artifact_path'),
                  'expires_in_seconds':handoff.get('expires_in_seconds')
              },open('/tmp/handoff.json','w'),separators=(',',':'))
              open('/tmp/delivery-mode','w').write('zero-copy')
          else:
              grant=data.get('direct_artifact') or {}
              path=str(grant.get('download_path','')).strip()
              name=str(grant.get('filename','')).strip()
              if not re.fullmatch(r'/__control/artifact/[0-9a-f]{64}',path): raise SystemExit('invalid direct grant')
              if not re.fullmatch(r'[A-Za-z0-9._-]{1,180}',name): raise SystemExit('invalid artifact filename')
              json.dump({'download_path':path,'filename':name},open('/tmp/grant.json','w'),separators=(',',':'))
              open('/tmp/delivery-mode','w').write('relay')
          PY
          rm -f /tmp/oidc.json /tmp/direct-response.json /tmp/binding.json /tmp/audience.txt

      - name: Download CircleCI artifact only when zero-copy is unavailable
        env:
          CONTROL_ORIGIN: https://mp-zr-webhook-ingress.eastcoast22-ec.workers.dev
        run: |
          set -euo pipefail
          umask 077
          mode="$(cat /tmp/delivery-mode)"
          if [ "$mode" = "zero-copy" ]; then
            echo 'zero_copy_handoff=ready; binary relay skipped'
            rm -f /tmp/request-source.json
            exit 0
          fi
          download_path="$(python3 -c 'import json; print(json.load(open("/tmp/grant.json"))["download_path"])')"
          filename="$(python3 -c 'import json; print(json.load(open("/tmp/grant.json"))["filename"])')"
          download_url="${CONTROL_ORIGIN}${download_path}/${filename}"
          mkdir -p /tmp/deliverable
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 1 --retry-delay 1 \
            "$download_url" -o "/tmp/deliverable/${filename}"
          FILENAME="$filename" python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          name=os.environ['FILENAME']
          path=pathlib.Path('/tmp/deliverable')/name
          ext=path.suffix.lower()
          allowed={'.apk','.zip','.json','.pdf'}
          if ext not in allowed: raise SystemExit('artifact type not allowed')
          if not path.is_file() or path.stat().st_size < 1: raise SystemExit('artifact missing or empty')
          if ext in {'.apk','.zip'} and not zipfile.is_zipfile(path): raise SystemExit('invalid zip container')
          if ext == '.json':
              with path.open('r',encoding='utf-8') as handle: json.load(handle)
          if ext == '.pdf':
              with path.open('rb') as handle:
                  if handle.read(5) != b'%PDF-': raise SystemExit('invalid pdf container')
          sha=hashlib.sha256(path.read_bytes()).hexdigest()
          json.dump({'schema_version':1,'mode':'relay','filename':name,'size_bytes':path.stat().st_size,'sha256':sha},open('/tmp/artifact-meta.json','w'),separators=(',',':'))
          print(f"artifact_ready filename={name} size={path.stat().st_size} sha256={sha}")
          PY
          rm -f /tmp/grant.json /tmp/request-source.json

      - name: Upload ChatGPT delivery metadata or relay artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mp-artifact-courier-${{ github.run_id }}
          path: |
            /tmp/handoff.json
            /tmp/artifact-meta.json
            /tmp/deliverable/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
