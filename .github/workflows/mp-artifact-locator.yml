name: MP Artifact Locator

on:
  push:
    branches:
      - mp-artifact-courier-v5
    paths:
      - locator/request.json

permissions:
  actions: read
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Locate courier run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          curl --fail --silent --show-error "${headers[@]}" \
            "${api}/contents/locator/request.json?ref=${SOURCE_SHA}" > /tmp/request.json
          python3 - <<'PY'
          import base64, json, re
          outer=json.load(open('/tmp/request.json'))
          req=json.loads(base64.b64decode(outer['content']).decode())
          sha=str(req.get('target_sha','')).lower()
          if not re.fullmatch(r'[0-9a-f]{40}', sha): raise SystemExit('invalid target_sha')
          open('/tmp/target_sha','w').write(sha)
          PY

          for attempt in $(seq 1 18); do
            curl --fail --silent --show-error "${headers[@]}" \
              "${api}/actions/workflows/mp-artifact-courier-v5.yml/runs?branch=mp-artifact-courier-v5&event=push&per_page=20" > /tmp/runs.json
            python3 - <<'PY'
          import json
          target=open('/tmp/target_sha').read().strip()
          runs=json.load(open('/tmp/runs.json')).get('workflow_runs',[])
          match=next((r for r in runs if str(r.get('head_sha','')).lower()==target), None)
          json.dump({
            'run_id': match.get('id') if match else None,
            'status': match.get('status') if match else None,
            'conclusion': match.get('conclusion') if match else None,
          }, open('/tmp/run.json','w'), separators=(',',':'))
          PY
            run_id="$(python3 -c 'import json; print(json.load(open("/tmp/run.json")).get("run_id") or "")')"
            status="$(python3 -c 'import json; print(json.load(open("/tmp/run.json")).get("status") or "")')"
            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then
              curl --fail --silent --show-error "${headers[@]}" \
                "${api}/actions/runs/${run_id}/artifacts?per_page=20" > /tmp/artifacts.json
              break
            fi
            sleep 4
          done

          python3 - <<'PY'
          import json, os
          target=open('/tmp/target_sha').read().strip()
          run=json.load(open('/tmp/run.json'))
          arts=[]
          if os.path.exists('/tmp/artifacts.json'):
              arts=json.load(open('/tmp/artifacts.json')).get('artifacts',[])
          matches=[a for a in arts if str(a.get('name','')).startswith('mp-artifact-courier-') and not a.get('expired')]
          result={
            'schema_version':1,
            'target_sha':target,
            'run_id':run.get('run_id'),
            'status':run.get('status'),
            'conclusion':run.get('conclusion'),
            'artifact_id':matches[0].get('id') if len(matches)==1 else None,
            'artifact_name':matches[0].get('name') if len(matches)==1 else None,
            'artifact_count':len(matches),
          }
          json.dump(result,open('/tmp/result.json','w'),separators=(',',':'))
          PY

          encoded="$(base64 -w0 /tmp/result.json)"
          existing_sha="$(curl --silent --show-error "${headers[@]}" \
            "${api}/contents/locator/result.json?ref=${REF_NAME}" | \
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha", ""))' 2>/dev/null || true)"
          ENCODED="$encoded" EXISTING_SHA="$existing_sha" python3 - <<'PY'
          import json, os
          payload={
            'message':'locator: publish courier artifact id',
            'content':os.environ['ENCODED'],
            'branch':os.environ['REF_NAME'],
          }
          sha=os.environ.get('EXISTING_SHA','').strip()
          if sha: payload['sha']=sha
          json.dump(payload,open('/tmp/put.json','w'),separators=(',',':'))
          PY
          curl --fail --silent --show-error -X PUT "${headers[@]}" \
            -H 'Content-Type: application/json' --data-binary @/tmp/put.json \
            "${api}/contents/locator/result.json" >/dev/null
